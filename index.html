<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ABVPGomati | Official Links</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Arial,Helvetica,sans-serif;color:#fff;
      background:radial-gradient(circle at top,#263b68 0,#111827 52%,#080d18 100%)}
    main{width:min(100%,420px);text-align:center;padding:38px 26px 30px;
      border:1px solid rgba(255,255,255,.16);border-radius:26px;
      background:rgba(255,255,255,.08);box-shadow:0 22px 70px rgba(0,0,0,.35);
      backdrop-filter:blur(12px)}
    .mark{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;
      display:grid;place-items:center;background:#fff;color:#172554;font-weight:900;font-size:25px}
    h1{margin:0;font-size:30px;letter-spacing:.4px}
    p{margin:10px 0 26px;color:#cbd5e1;font-size:14px}
    a{display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:16px;margin:13px 0;border-radius:14px;
      color:#fff;text-decoration:none;font-weight:700;font-size:16px;
      transition:transform .15s,filter .15s}
    a:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .ig{background:linear-gradient(110deg,#833ab4,#fd1d1d,#fcb045)}
    .fb{background:#1877f2}
    .icon{font-size:20px}
    footer{margin-top:25px;color:#94a3b8;font-size:11px;letter-spacing:1.5px}
  </style>
</head>
<body>
  <main>
    <div class="mark">ABVP</div>
    <h1>ABVPGomati</h1>
    <p>Connect with us on social media</p>
    <a class="ig" href="https://www.instagram.com/abvp_gomati_district?cplk=MWdmeDhiazVlbmZlbw==" target="_blank" rel="noopener noreferrer">
      <span class="icon">◎</span> Instagram
    </a>
    <a class="fb" href="https://www.facebook.com/share/1CAixFkRUd/" target="_blank" rel="noopener noreferrer">
      <span class="icon">f</span> Facebook
    </a>
    <footer>ABVPGOMATI · OFFICIAL SOCIAL LINKS</footer>
  </main>
</body>
</html>
